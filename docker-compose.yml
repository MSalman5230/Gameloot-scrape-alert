services:
  stockwatch:
    image: ghcr.io/msalman5230/gameloot-scrape-alert:latest
    container_name: gameloot-scrape-alert
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"  # dashboard: http://<host>:8000 (no auth; keep it on a trusted network)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
